# Experiment Configuration for ANNS Thesis
# =========================================
# This file defines all experiments, parameters, and settings
# for reproducible benchmarking of HNSW and early termination strategies.

experiment:
  name: "unified_comparison"
  description: "Comprehensive benchmark of HNSW variants with early termination"
  seed: 42  # Random seed for reproducibility
  num_runs: 5  # Number of runs for statistical significance
  warmup_runs: 2  # Warmup runs before measurement

# Dataset Configuration
# =====================
datasets:
  siftsmall:
    name: "siftsmall"
    base: "Datasets/siftsmall/siftsmall_base.fvecs"
    query: "Datasets/siftsmall/siftsmall_query.fvecs"
    gt: "Datasets/siftsmall/siftsmall_groundtruth.ivecs"
    description: "Small SIFT subset for quick experiments"
    dimension: 128
    num_base: 10000
    num_query: 100

  sift:
    name: "sift"
    base: "Datasets/sift/sift_base.fvecs"
    query: "Datasets/sift/sift_query.fvecs"
    gt: "Datasets/sift/sift_groundtruth.ivecs"
    description: "Full SIFT dataset (1M vectors)"
    dimension: 128
    num_base: 1000000
    num_query: 10000

  glove100ann:
    name: "glove100ann"
    base: "Datasets/glove100ann/glove100ann_base.fvecs"
    query: "Datasets/glove100ann/glove100ann_query.fvecs"
    gt: "Datasets/glove100ann/glove100ann_groundtruth.ivecs"
    description: "GloVe embeddings 100D"
    dimension: 100
    num_base: 1183514
    num_query: 10000

  gist960ann:
    name: "gist960ann"
    base: "Datasets/gist960ann/gist960ann_base.fvecs"
    query: "Datasets/gist960ann/gist960ann_query.fvecs"
    gt: "Datasets/gist960ann/gist960ann_groundtruth.ivecs"
    description: "GIST descriptors 960D"
    dimension: 960
    num_base: 1000000
    num_query: 1000

  fashion_mnist:
    name: "fashion_mnist"
    base: "Datasets/fashion_mnist/fashion_mnist_base.fvecs"
    query: "Datasets/fashion_mnist/fashion_mnist_query.fvecs"
    gt: "Datasets/fashion_mnist/fashion_mnist_groundtruth.ivecs"
    description: "Fashion MNIST images"
    dimension: 784
    num_base: 60000
    num_query: 10000

# Algorithm Configurations
# ========================

# Baseline HNSW Parameters
hnsw:
  enabled: true
  M: [8, 16, 32, 64]  # Connections per node
  efConstruction: [100, 200, 400]
  efSearch: [10, 20, 50, 100, 200, 500, 1000]
  description: "Standard HNSW without early termination"

# DARTH (Dynamic Adaptive Re-termination)
darth:
  enabled: true
  M: [8, 16, 32]
  efConstruction: [100, 200]
  efSearch: [10, 20, 50, 100, 200]
  Rt: [0.80, 0.85, 0.90, 0.95, 0.99]  # Re-termination threshold
  ipi: [100, 200, 500]  # Initial prediction interval
  mpi: [10, 20, 50]  # Minimum prediction interval
  description: "History-based early termination"

# PiP (Patience in Proximity)
pip:
  enabled: true
  M: [8, 16, 32]
  efConstruction: [100, 200]
  efSearch: [10, 20, 50, 100, 200]
  pip_gamma: [90, 95, 99]  # Saturation threshold (percentage)
  pip_delta: [5, 10, 20]  # Patience (consecutive iterations)
  description: "Saturation-based early termination"

# Ada-ef (Adaptive Exploration Factor)
adaef:
  enabled: true
  M: [8, 16, 32]
  efConstruction: [100, 200]
  target_recall: [0.85, 0.90, 0.95, 0.99]  # Target recall for offline phase
  adaef_bins: 100  # Number of difficulty bins
  adaef_delta: 0.05  # Recall tolerance
  description: "Query difficulty-based adaptive ef"

# Baseline Comparisons (External Libraries)
baselines:
  enabled: true
  hnswlib:
    efSearch: [10, 20, 50, 100, 200, 500]
    description: "hnswlib implementation"
  faiss_hnsw:
    efSearch: [10, 20, 50, 100, 200]
    description: "FAISS HNSW implementation"
  index_flat_l2:
    description: "Exact search baseline (IndexFlatL2)"

# Evaluation Metrics
# ==================
metrics:
  k_values: [1, 5, 10, 20, 50, 100]  # k for Recall@k
  measure_memory: true  # Track memory usage
  measure_build_time: true  # Track index construction time
  measure_per_query: false  # Set to true for detailed per-query analysis
  output_dir: "results_csv"
  plots_dir: "plot_results"

# Statistical Analysis
# ===================
statistics:
  compute_confidence_intervals: true
  confidence_level: 0.95
  use_error_bars: true
  test_significance: true
  significance_threshold: 0.05

# Experiment Profiles
# ====================
# Pre-defined experiment sets for different purposes

profiles:
  quick_test:
    description: "Fast test with minimal parameters"
    num_runs: 1
    datasets: ["siftsmall"]
    hnsw:
      M: [16]
      efConstruction: [200]
      efSearch: [20, 50, 100]
    darth:
      M: [16]
      Rt: [0.90, 0.95]
    pip:
      M: [16]
      pip_gamma: [95]
      pip_delta: [10]
    adaef:
      M: [16]
      target_recall: [0.90, 0.95]

  full_benchmark:
    description: "Complete benchmark for thesis results"
    num_runs: 5
    datasets: ["siftsmall", "sift", "glove100ann"]
    hnsw:
      M: [8, 16, 32]
      efConstruction: [100, 200]
      efSearch: [10, 20, 50, 100, 200, 500]
    darth:
      M: [8, 16]
      Rt: [0.85, 0.90, 0.95, 0.99]
    pip:
      M: [8, 16]
      pip_gamma: [90, 95, 99]
      pip_delta: [10, 20]
    adaef:
      M: [8, 16]
      target_recall: [0.85, 0.90, 0.95, 0.99]

  parameter_sensitivity:
    description: "Detailed parameter sensitivity analysis"
    num_runs: 3
    datasets: ["sift"]
    hnsw:
      M: [4, 8, 16, 32, 64, 128]
      efConstruction: [100, 200, 400]
      efSearch: [10, 20, 50, 100, 200, 500, 1000]
    darth:
      M: [8, 16, 32]
      Rt: [0.70, 0.80, 0.85, 0.90, 0.95, 0.99]
    pip:
      M: [8, 16, 32]
      pip_gamma: [80, 85, 90, 95, 99]
      pip_delta: [3, 5, 10, 20]

  scalability_test:
    description: "Test scalability across dataset sizes"
    num_runs: 3
    datasets: ["siftsmall", "sift"]
    hnsw:
      M: [16]
      efConstruction: [200]
      efSearch: [50, 100]

# Hardware Configuration
# ======================
hardware:
  cpu: "Apple M1/M2/M3"  # For reference
  ram_gb: 16
  note: "Memory and CPU info logged at runtime"

# Output Settings
# ================
output:
  save_raw_results: true
  save_processed_results: true
  save_plots: true
  plot_formats: ["png", "pdf"]
  create_summary_tables: true
  generate_latex_tables: false
  csv_timestamp: true  # Add timestamp to output files
